# Regulations, supervisory guidelines and standards the question bank relates to.
#
# Locators cited in the question bank were checked on 2026-10-24 against the text named in
# `verified_via`, and a second reviewer spot-checked about 45 of them. Where an official site would
# not serve the text, a mirror or summary was used and that is stated; some locators are marked as
# still to be confirmed by hand. Check every locator against the official text before relying on it.
#
# A reference means "this obligation or principle is relevant to the question". It never means a
# firm that answers well complies with it.

sources:
