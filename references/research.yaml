# Research behind the Exit-Readiness method.
# Every entry was opened and checked (title, authors, date and the finding stated) on 2026-10-24.
# Findings are paraphrased; figures are as the source states them.
# `supports` names the scorecard measures or themes each item is evidence for.

research:
  - id: opara-martins-2016
    short: Opara-Martins et al. 2016
    title: "Critical analysis of vendor lock-in and its impact on cloud computing migration: a business perspective"
    publisher: "J. Opara-Martins, R. Sahandi, F. Tian. Journal of Cloud Computing 5, article 4"
    date: "2016"
    type: peer-reviewed
    url: https://link.springer.com/article/10.1186/s13677-016-0054-z
    finding: In a survey of 114 participants, 71% said lock-in risk would deter them from adopting more cloud services, and only 8.4% named building lock-in risk into the initial risk assessment as a best practice.
    supports: [lock-in, context, exit-planning]

  - id: farrell-klemperer-2007
    short: Farrell & Klemperer 2007
    title: "Coordination and Lock-In: Competition with Switching Costs and Network Effects"
    publisher: "J. Farrell, P. Klemperer. Handbook of Industrial Organization, vol. 3, ch. 31, Elsevier"
    date: "2007"
    type: peer-reviewed
    url: https://ideas.repec.org/h/eee/indchp/3-31.html
    finding: Switching costs and incompatibility give suppliers market power over customers once they are locked in, and firms tend to seek more incompatibility than is efficient.
    supports: [lock-in, debt, contract]

  - id: klemperer-1995
    short: Klemperer 1995
    title: "Competition when Consumers have Switching Costs"
    publisher: "P. Klemperer. Review of Economic Studies 62(4):515-539"
    date: "1995"
    type: peer-reviewed
    url: https://ideas.repec.org/a/oup/restud/v62y1995i4p515-539..html
    finding: Where switching costs exist, suppliers trade off low prices to win customers against high prices to profit from customers already locked in.
    supports: [lock-in, contract]

  - id: peukert-2019
    short: Peukert 2019
    title: "Determinants and heterogeneity of switching costs in IT outsourcing: estimates from firm-level data"
    publisher: "C. Peukert. European Journal of Information Systems 28(3):291-317"
    date: "2019"
    type: peer-reviewed
    url: https://ideas.repec.org/a/taf/tjisxx/v28y2019i3p291-317.html
    finding: Across 1,318 US credit unions over 11 years, average IT-outsourcing switching costs were about one-third of annual spend on professional services.
    supports: [swap, lock-in]

  - id: promptbridge-2025
    short: Wang et al. 2025 (preprint)
    title: "PromptBridge: Cross-Model Prompt Transfer for Large Language Models"
    publisher: "Y. Wang et al. arXiv:2512.01420 (preprint, not peer-reviewed)"
    date: "2025"
    type: preprint
    url: https://arxiv.org/abs/2512.01420
    finding: Prompts engineered for one large language model often perform substantially worse on another, so moving an AI process between model suppliers carries a real re-engineering cost.
    supports: [context, ai-dependency, swap]

  - id: bis-fsi-53-2023
    short: BIS FSI Insights 53
    title: "Managing cloud risk - some considerations for the oversight of critical cloud service providers in the financial sector"
    publisher: "T.Y. Koh, J. Prenio. Bank for International Settlements, Financial Stability Institute"
    date: "2023-11-16"
    type: supervisory
    url: https://www.bis.org/fsi/publ/insights53.htm
    finding: A major outage at a dominant cloud provider could disrupt critical financial services across the system, a risk that firm-by-firm third-party frameworks do not capture.
    supports: [concentration, fallback]

  - id: fsb-ai-2024
    short: FSB 2024 (AI)
    title: "The Financial Stability Implications of Artificial Intelligence"
    publisher: Financial Stability Board
    date: "2024-11-14"
    type: supervisory
    url: https://www.fsb.org/uploads/P14112024.pdf
    finding: Third-party dependencies and service-provider concentration are the first of four AI-related vulnerabilities the FSB identifies as able to increase systemic risk.
    supports: [concentration, ai-dependency]

  - id: boe-fpc-ai-2025
    short: Bank of England FPC 2025
    title: "Financial Stability in Focus: Artificial intelligence in the financial system"
    publisher: Bank of England, Financial Policy Committee
    date: "2025-04-09"
    type: supervisory
    url: https://www.bankofengland.co.uk/financial-stability-in-focus/2025/april-2025
    finding: Reliance on a small number of providers for a service could create systemic risk, and some AI model providers could become critical third parties.
    supports: [concentration, ai-dependency]

  - id: boe-ps16-24
    short: PRA/FCA PS16/24
    title: "PS16/24 - Operational resilience: Critical third parties to the UK financial sector"
    publisher: Bank of England, PRA and FCA
    date: "2024-11-12"
    type: supervisory
    url: https://www.bankofengland.co.uk/prudential-regulation/publication/2024/november/operational-resilience-critical-third-parties-to-the-uk-financial-sector-policy-statement
    finding: Final rules for overseeing critical third parties, in force from 1 January 2025, responding to growing reliance on a few service providers whose failure would hit many firms at once.
    supports: [concentration]

  - id: ecb-register-2024
    short: ECB 2024 outsourcing analysis
    title: "Outsourcing Register: Annual Horizontal Analysis"
    publisher: ECB Banking Supervision
    date: "2024-02-21"
    type: supervisory
    url: https://www.bankingsupervision.europa.eu/ecb/pub/pdf/ssm.outsourcing_horizontal_analysis_202402~2b85022be5.en.pdf
    finding: Across 109 significant banks, about half of the budget for critical third-party contracts went to the top 20 providers; about 5% of critical external contracts were impossible to substitute and about 20% impossible to bring back in-house.
    supports: [concentration, fallback, swap]

  - id: ecb-newsletter-2025
    short: ECB 2025 outsourcing trends
    title: "Outsourcing trends in the banking sector"
    publisher: ECB Banking Supervision, Supervision Newsletter
    date: "2025-02-19"
    type: supervisory
    url: https://www.bankingsupervision.europa.eu/press/supervisory-newsletters/newsletter/2025/html/ssm.nl250219_2.en.html
    finding: The share of outsourced critical functions that are difficult or impossible to substitute rose from 80% to 82%, and 95% of those are difficult or impossible to bring back in-house.
    supports: [fallback, swap, concentration]

  - id: esas-ict-landscape-2023
    short: ESAs 2023 ICT provider landscape
    title: "Landscape of ICT third-party providers in the EU (ESA 2023 22)"
    publisher: EBA, EIOPA and ESMA
    date: "2023-09-19"
    type: supervisory
    url: https://www.eba.europa.eu/sites/default/files/document_library/Publications/Reports/2023/1062211/ESA%202023%2022%20-%20ESAs%20report%20on%20the%20landscape%20of%20ICT%20TPPs.pdf
    finding: In a voluntary sample, about half of entities used a critical ICT service that was not substitutable, rising to about three-quarters for frequently used providers.
    supports: [fallback, concentration]

  - id: esas-incidents-2026
    short: ESAs 2026 incident report
    title: "Joint report on major ICT-related incidents in 2025 (JC 2026 16)"
    publisher: EBA, EIOPA and ESMA
    date: "2026-06-03"
    type: supervisory
    url: https://www.eiopa.europa.eu/publications/esas-joint-report-major-ict-related-incidents-2025_en
    finding: Of 3,383 major ICT incidents reported by EU financial entities in 2025, 29% were caused by a failure attributable to a third-party provider.
    supports: [concentration, fallback]

  - id: bcbs-tpr-2025
    short: BCBS 2025
    title: "Principles for the sound management of third-party risk"
    publisher: Basel Committee on Banking Supervision
    date: "2025-12-10"
    type: supervisory
    url: https://www.bis.org/publications/202512-guidelines-principles-sound-management-third-party-risk.pdf
    finding: Banks are expected to prepare for leaving a provider both by choice and in a crisis, using realistic scenarios, and to consider concentration risk before contracting.
    supports: [swap, contract, concentration]

  - id: imf-ai-cyber-2026
    short: IMF Note 2026/005
    title: "Artificial Intelligence and Cybersecurity in the Financial Sector"
    publisher: "T. Adrian, T. Gaidosch, M. Moretti, M. Qureshi, R. Ravikumar. IMF Note 2026/005"
    date: "2026-06"
    type: supervisory
    url: https://www.imf.org/-/media/files/publications/imf-notes/2026/english/insea2026005.pdf
    finding: Concentration in a small number of AI and cloud providers can create single points of failure; third-party frameworks should cover concentration, substitutability and dependency.
    supports: [concentration, ai-dependency, fallback]

  - id: esma-trv-2021
    short: ESMA TRV 2021
    title: "Cloud outsourcing and financial stability risks (TRV No. 2, 2021, pp. 63-71)"
    publisher: "C. Asensio, A. Bouveret, A. Harris. European Securities and Markets Authority"
    date: "2021"
    type: supervisory
    url: https://www.esma.europa.eu/sites/default/files/trv_2021_2-cloud_outsourcing_and_financial_stability_risks.pdf
    finding: In an illustrative model of simultaneous outages of two hours or more, the probability of a systemic event under cloud outsourcing without backup was around a thousand times the no-cloud baseline; with a backup provider it fell to about the baseline. The model assumes a provider's clients fail together and that different providers fail independently.
    supports: [fallback, concentration]

  - id: us-treasury-cloud-2023
    short: US Treasury 2023
    title: "The Financial Services Sector's Adoption of Cloud Services"
    publisher: US Department of the Treasury
    date: "2023-02-08"
    type: government
    url: https://home.treasury.gov/system/files/136/Treasury-Cloud-Report.pdf
    finding: Moving complex workloads to another cloud provider or back in-house was expected to take many months, or even years, in nearly every case.
    supports: [swap, fallback]

  - id: cma-cloud-2025
    short: UK CMA 2025
    title: "Cloud Services Market Investigation: Summary of final decision"
    publisher: UK Competition and Markets Authority
    date: "2025-07-31"
    type: competition-authority
    url: https://assets.publishing.service.gov.uk/media/688b20e6ff8c05468cb7b120/summary_of_final_decision.pdf
    finding: Fewer than 1% of customers switch cloud provider each year, and egress fees and licensing practices are key barriers to switching.
    supports: [lock-in, context, contract]

  - id: uptime-2025
    short: Uptime Institute 2025
    title: "Annual Outage Analysis 2025 (press release)"
    publisher: Uptime Institute
    date: "2025-05-06"
    type: industry
    url: https://uptimeinstitute.com/about-ui/press-releases/uptime-announces-annual-outage-analysis-report-2025
    finding: Over nine years of publicly reported outages, third-party IT and data-centre service providers accounted for about two-thirds.
    supports: [fallback, concentration]

  - id: oecd-ai-infra-2025
    short: OECD 2025
    title: "Competition in artificial intelligence infrastructure"
    publisher: OECD Roundtables on Competition Policy Papers
    date: "2025-11-13"
    type: intergovernmental
    url: https://www.oecd.org/en/publications/competition-in-artificial-intelligence-infrastructure_623d1874-en.html
    finding: Maps the AI supply chain, especially chips and compute, and identifies features that make these markets prone to competition problems. Cited for context only.
    supports: [ai-dependency, concentration]
