name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke-test the scorecard
        run: |
          cd "$RUNNER_TEMP"
          opcp scorecard form
          opcp scorecard example
          opcp scorecard run example-assessment.yaml -o report.html
          opcp demo > /dev/null
