name: Release

# Runs when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0),
# or by hand from the Actions tab ("Run workflow") with an existing or new tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0 (created on main if it does not exist)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true
      publish_pypi:
        description: "Also publish to PyPI (needs the trusted publisher set up, see docs/RELEASING.md)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        id: version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match pyproject version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Test the built wheel
        run: |
          pip install dist/*.whl pytest
          pytest -q
      - name: Build the downloadable form and example report
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p assets
          opcp scorecard form "assets/opcp-exit-readiness-form-$v.html"
          opcp scorecard run examples/example-bank-answers.yaml -o "assets/opcp-example-report-$v.html"
          opcp scorecard readout examples/example-bank-answers.yaml -o "assets/opcp-example-readout-$v.html"
          cp dist/*.whl dist/*.tar.gz assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'true' }}
        run: |
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "::error::Missing release notes at $notes"; exit 1; }
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          gh release create "$TAG" assets/* --target "$GITHUB_SHA" \
            --title "OPCP $TAG" --notes-file "$notes" $flags

  pypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
